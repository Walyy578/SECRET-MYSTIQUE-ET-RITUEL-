<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppression de compte — Oracle Football Pronostics (Ibdev)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0D001A; color: #E8E0F5; display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh; }
        .container { background: #1A0033; padding: 30px; border-radius: 15px; border: 1px solid #FFD700; max-width: 500px; width: 100%; }
        h1 { color: #FFD700; text-align: center; margin-bottom: 20px; }
        p { font-size: 14px; color: #D0C4E8; margin-bottom: 15px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #9D4EDD; background: #0D001A; color: #fff; }
        button { width: 100%; padding: 12px; background: #FFD700; color: #0D001A; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #B8860B; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-danger { background: #FF3333; color: white; }
        .btn-danger:hover { background: #CC0000; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Supprimer mon compte</h1>
        <p>Application : <strong>Oracle Football Pronostics</strong> (Développeur : <strong>Ibdev</strong>)</p>
        
        <!-- ÉTAPE 1 : Connexion (Obligatoire pour des raisons de sécurité) -->
        <div id="loginSection">
            <p>Pour supprimer vos données, vous devez d'abord vous connecter avec le compte que vous souhaitez supprimer.</p>
            <input type="email" id="emailInput" placeholder="Votre adresse e-mail" required>
            <input type="password" id="passwordInput" placeholder="Votre mot de passe" required>
            <button onclick="loginAndDelete()">Se connecter et Supprimer</button>
        </div>

        <!-- ÉTAPE 2 : Confirmation après connexion -->
        <div id="deleteSection" class="hidden">
            <p>Vous êtes connecté en tant que : <strong id="userEmailDisplay"></strong></p>
            <p style="color: #FF3333; font-weight: bold;">Attention : Cette action est irréversible.</p>
            <button class="btn-danger" onclick="deleteAccount()" id="btnDelete">Confirmer la suppression définitive</button>
        </div>

        <div id="message"></div>
    </div>

    <!-- Importation du SDK Firebase Web (Version Modulaire) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, deleteUser, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REMPLACEZ PAR VOS PROPRES CLÉS FIREBASE
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "paris-mystique.firebaseapp.com",
            projectId: "paris-mystique",
            storageBucket: "paris-mystique.firebasestorage.app",
            messagingSenderId: "307416827612",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const msgDiv = document.getElementById('message');
        const loginSection = document.getElementById('loginSection');
        const deleteSection = document.getElementById('deleteSection');

        // Vérifier si l'utilisateur est déjà connecté au chargement de la page
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                deleteSection.classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
            } else {
                loginSection.classList.remove('hidden');
                deleteSection.classList.add('hidden');
            }
        });

        // Fonction de connexion
        window.loginAndDelete = async function() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            msgDiv.innerText = "Connexion en cours...";
            msgDiv.style.color = "#FFD700";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                msgDiv.innerText = "Connecté. Vous pouvez maintenant confirmer la suppression.";
                msgDiv.style.color = "#00FF00";
            } catch (error) {
                msgDiv.innerText = "Erreur de connexion : " + error.message;
                msgDiv.style.color = "#FF0000";
            }
        };

        // Fonction de suppression réelle
        window.deleteAccount = async function() {
            const user = auth.currentUser;
            if (!user) return;

            const btn = document.getElementById('btnDelete');
            btn.disabled = true;
            btn.innerText = "Suppression en cours...";
            msgDiv.innerText = "";

            try {
                // 1. Supprimer les données Firestore (si les règles le permettent)
                // On suppose que la collection s'appelle "users" et l'ID est l'UID
                await deleteDoc(doc(db, "users", user.uid));

                // 2. Supprimer le compte Firebase Auth
                await deleteUser(user);

                msgDiv.innerText = "✅ Votre compte et toutes vos données ont été supprimés avec succès.";
                msgDiv.style.color = "#00FF00";
                
                // Vider les champs
                loginSection.classList.add('hidden');
                deleteSection.classList.add('hidden');

            } catch (error) {
                console.error(error);
                if (error.code === 'auth/requires-recent-login') {
                    msgDiv.innerText = "Erreur : Pour des raisons de sécurité, veuillez vous déconnecter et vous reconnecter, puis réessayer.";
                } else {
                    msgDiv.innerText = "Erreur : " + error.message;
                }
                msgDiv.style.color = "#FF0000";
                btn.disabled = false;
                btn.innerText = "Confirmer la suppression définitive";
            }
        };
    </script>
</body>
</html>
